name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN_1: ${{ secrets.HF_TOKEN }}
        run: git push --force https://GautamPandey28:$HF_TOKEN_1@huggingface.co/spaces/GautamPandey28/Search_Engine_LLM_Groq main
